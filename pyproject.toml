[project]
name = "xangi-dots"
version = "0.1.1"
description = "Persistent Dots task inbox for xangi Managed Extensions"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
